<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aura</title>
    <style>
      :root {
        --bg: #0e1613; --ink: #e8e2cf; --dim: #8e948a; --panel: #16201cf2; --line: #2f3e37;
        --gold: #e0b450; --red: #c8412f; --amber: #ffb020; --green: #7bc96f; --parch: #efe3c2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 Georgia, "Times New Roman", serif; overflow: hidden; }
      button { font: inherit; color: inherit; background: #26332d; border: 1px solid #405349; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
      button:hover:not(:disabled) { background: #33453c; }
      button:disabled { opacity: .45; cursor: default; }
      button.on { background: #52642f; border-color: #9ab35f; }
      button.big { font-size: 18px; padding: 10px 26px; margin: 6px; }
      button.wide { display: block; width: 100%; text-align: left; margin: 4px 0; }
      .dim { color: var(--dim); } .small { font-size: 12px; } .red { color: var(--red); } .gold { color: var(--gold); } .ok { color: var(--green); } .amber { color: var(--amber); }
      .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: radial-gradient(circle at 50% 40%, #1d2d27, #070c0a); z-index: 50; padding: 16px; overflow: auto; }
      .screen.show { display: flex; }
      h1 { font-size: 72px; letter-spacing: .3em; margin: 0 0 0 .3em; font-weight: normal; color: var(--gold); }
      h2 { margin: 0 0 6px; font-weight: normal; color: var(--gold); }
      h3 { margin: 10px 0 4px; font-size: 14px; color: var(--gold); font-weight: normal; text-transform: uppercase; letter-spacing: .08em; }
      #game { position: fixed; inset: 0; display: none; }
      #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
      #map [data-m] { cursor: pointer; }
      .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
      #top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 5; }
      #top > * { pointer-events: auto; }
      #clock { min-width: 190px; }
      .bar { height: 4px; background: #2a3831; border-radius: 2px; overflow: hidden; margin-top: 4px; }
      .bar > div { height: 100%; background: var(--gold); }
      #res { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; justify-content: center; }
      .res b { font-weight: normal; font-size: 16px; }
      #notice { width: 240px; }
      .gauge { position: relative; height: 12px; background: linear-gradient(90deg, #2c4a36, #6a6a2a 50%, #7a4a1f 75%, #7a2a1f 90%); border-radius: 6px; margin: 6px 0; }
      .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #fff3; border-right: 2px solid #fff; border-radius: 6px 0 0 6px; }
      .gauge .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #000a; }
      .gauge .eq { position: absolute; top: -4px; width: 12px; height: 20px; margin-left: -6px; border: 2px solid var(--ink); border-radius: 50%; }
      #magi { position: absolute; left: 8px; top: 110px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
      .mag { display: flex; gap: 8px; align-items: center; width: 190px; cursor: pointer; }
      .mag.off { opacity: .5; }
      .face { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; background: #22302a; }
      .td { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 2px; vertical-align: middle; }
      .t\+ { background: var(--gold); } .t- { background: #8e2a1f; } .t\± { background: linear-gradient(90deg, var(--gold) 50%, #8e2a1f 50%); }
      #alerts { position: absolute; right: 8px; bottom: 70px; width: 270px; display: flex; flex-direction: column; gap: 6px; z-index: 6; }
      #alerts.shift { right: 356px; }
      .alert { cursor: pointer; border-left: 3px solid var(--amber); }
      #panel { position: absolute; right: 8px; top: 215px; bottom: 64px; background: #16201c; width: 340px; overflow: auto; z-index: 7; display: none; }
      #panel.show { display: block; }
      #panel .x { float: right; }
      .row { display: flex; justify-content: space-between; gap: 8px; }
      .trait { margin: 4px 0; padding: 4px 6px; background: #0003; border-radius: 4px; }
      #bottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; display: flex; gap: 8px; align-items: center; z-index: 5; }
      #prompt { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; max-width: 460px; background: var(--parch); color: #3a2c14; padding: 8px 30px 8px 12px; border-radius: 3px; box-shadow: 0 3px 10px #0008; z-index: 6; display: none; font-style: italic; }
      #prompt button { position: absolute; right: 4px; top: 4px; background: none; border: none; color: #3a2c14; padding: 0 4px; }
      #hint { position: absolute; left: 50%; transform: translateX(-50%); top: 96px; z-index: 6; display: none; border-color: var(--green); }
      .card { background: #1b2621; border: 1px solid var(--gold); border-radius: 10px; padding: 18px; max-width: 440px; text-align: left; }
      .card .art { font-size: 44px; text-align: center; color: var(--gold); }
      .ench { margin: 6px 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #0002; }
      .ench.done { border-color: var(--gold); }
      #modal, #pause { background: #000a; }
      .stats { display: grid; grid-template-columns: auto auto; gap: 2px 16px; text-align: left; margin: 10px auto; }
      @media (max-width: 760px) {
        #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 56px; max-height: 55%; }
        #alerts, #alerts.shift { right: 8px; width: 200px; bottom: auto; top: 200px; }
        #magi { top: auto; bottom: 60px; } .mag { width: 150px; }
        #notice { width: 100%; } h1 { font-size: 48px; }
      }
    </style>
  </head>
  <body>
    <div id="title" class="screen show">
      <svg width="260" height="120" viewBox="0 0 260 120" aria-hidden="true">
        <path d="M0 90 Q35 80 65 90 T130 90 T195 90 T260 90" stroke="#3d6f78" fill="none" stroke-width="2" />
        <path d="M0 104 Q35 94 65 104 T130 104 T195 104 T260 104" stroke="#2b5058" fill="none" stroke-width="2" />
        <polygon points="110,82 130,30 150,82" fill="#3a3a33" />
        <rect x="124" y="14" width="12" height="40" fill="#5a5448" />
        <circle cx="130" cy="10" r="4" fill="#e0b450" />
        <circle cx="200" cy="30" r="10" fill="none" stroke="#b27cff" />
      </svg>
      <h1>AURA</h1>
      <p class="dim"><i>The Covenant Must Grow</i></p>
      <p class="small dim" style="max-width:420px">Normandy, 1220. Grow a covenant of wizards on Mont-Dol. Open the Drowned Gate before 1260, and don't draw so much Notice that the Order renounces you.</p>
      <button id="contBtn" class="big" data-a="cont">Continue</button>
      <button class="big" data-a="found">Found the Covenant</button>
    </div>

    <div id="game">
      <svg id="map" viewBox="-400 -400 800 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="mix"><stop offset=".5" stop-color="#e0b450" /><stop offset=".5" stop-color="#8e2a1f" /></linearGradient>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="top">
        <div id="clock" class="box"></div>
        <div id="res" class="box"></div>
        <div id="notice" class="box" style="display:none"></div>
      </div>
      <div id="magi"></div>
      <div id="alerts"></div>
      <div id="hint" class="box"></div>
      <div id="panel" class="box"></div>
      <div id="prompt"></div>
      <div id="bottom"></div>
    </div>

    <div id="modal" class="screen"></div>
    <div id="pause" class="screen"></div>
    <div id="end" class="screen"></div>

    <script>
// ─── Data registries ───────────────────────────────────────────────
const G = {
  silver: { n: 'Silver', c: '#c9ced6', s: '◉' }, stone: { n: 'Stone', c: '#9a9ca3', s: '▲' },
  bread: { n: 'Bread', c: '#d99a4e', s: '◗' }, vellum: { n: 'Vellum', c: '#efe3c2', s: '▭' },
  vis: { n: 'Vis', c: '#b27cff', s: '✦' }, insight: { n: 'Insight', c: '#6fd3ff', s: '◈' },
  grain: { n: 'Grain', c: '#e8d25a', s: '⁂' }, salt: { n: 'Salt', c: '#ffffff', s: '◇' },
};
const HUD_GOODS = ['silver', 'stone', 'bread', 'vellum', 'vis', 'insight'];
const HALL_OUT = ['stone', 'bread', 'vellum', 'vis', 'grain'];
const RINGS = [
  { n: 'Hearth', f: .5, r: 120 }, { n: 'Bocage', f: 1.5, r: 220 }, { n: 'Marsh', f: .5, r: 320 },
];
const RD = [[0, 1, 2], [1, 0, 1], [2, 1, 0]]; // ring distance lookup
const T = {
  hall: { n: 'Covenant Hall', shape: 'circle', col: '#d8b45a', sym: '⌂', out: {} },
  farm: { n: 'Farm', rings: [1], cost: { silver: 20 }, out: { grain: 1 }, shape: 'rect', col: '#7bb661', sym: '⁂' },
  bakehouse: { n: 'Bakehouse', rings: [0, 1], cost: { silver: 30, stone: 10 }, in: { grain: 1 }, out: { bread: 1 }, shape: 'tri', col: '#d99a4e', sym: '◗' },
  saltpan: { n: 'Salt Pan', rings: [2], cost: { silver: 20 }, out: { salt: .5 }, shape: 'diamond', col: '#dfe8ee', sym: '◇' },
  quarry: { n: 'Quarry', rings: [0], cost: { silver: 40 }, out: { stone: .5 }, shape: 'hex', col: '#8d8f96', sym: '▲' },
  parchmenter: { n: 'Parchmenter', rings: [1], cost: { silver: 30 }, out: { vellum: .25 }, shape: 'wide', col: '#e6d6a8', sym: '▭' },
  vissource: { n: 'Vis Source', rings: [2], cost: { silver: 40 }, out: { vis: .1 }, shape: 'star', col: '#b27cff', sym: '✦' },
  sanctum: { n: 'Sanctum', rings: [0], cost: { silver: 100, stone: 50 }, in: { vellum: .25, vis: .05 }, out: { insight: .1 }, shape: 'pent', col: '#6fd3ff', sym: '☉' },
  gate: { n: 'Regio Gate', cost: { silver: 200, stone: 100 }, shape: 'arch', col: '#4fb3a5', sym: '∩', out: {} },
};
const TIERS = [{ n: 'Porter', cap: 2 }, { n: 'Mule', cap: 6 }, { n: 'Walking Stones', cap: 20 }];
// [name, tone, effect, story or removal rule, flat Notice per minute]
const TR = {
  affinity: ['Affinity with Vim', '+', "This magus's Sanctum needs 50% less Vis", 'Raw magic comes to them like a tame hound'],
  gentle: ['Gentle Gift', '+', "Connections into this magus's Sanctum carry +50%", "Workers don't flinch when they pass"],
  diligent: ['Diligent Scholar', '+', 'Study costs 25% less', 'Reads by candlelight until dawn'],
  blatant: ['Blatant Gift', '-', "Connections into this magus's Sanctum carry −50%", 'Porters leave their loads at the gate and run'],
  hunted: ['Hunted by a Rival', '-', 'Notice +0.5 per minute', 'A rival magus writes to the Tribunal every season', .5],
  absent: ['Absent-Minded', '-', '10% of the Vellum this Sanctum receives is wasted', 'Half-finished notes on every surface'],
  aligned: ['Aligned with the Aura', '+', 'Insight ×1.25', 'Permanent'],
  greathearth: ['Great Hearth', '+', 'This Sanctum needs no Bread', 'Permanent'],
  warded: ['Warded Cell', '+', "This Sanctum's Notice weight is 0", 'Permanent'],
  drafty: ['Drafty', '-', '20% of the Vellum received spoils', 'Removed by reaching level 5 (the walls are finally sealed)'],
  haunted: ['Haunted', '±', 'Insight ×1.1, but Notice +0.5 per minute', 'Removed by an exorcism: 100 Silver (loses the bonus too)', .5],
  cramped: ['Cramped', '-', "Can't level above 6", 'Removed by expanding: 500 Silver + 250 Stone'],
  fertile: ['Fertile Ground', '+', 'A node here produces ×1.5', 'Old monastery land'],
  roman: ['Old Roman Road', '+', 'Connections from here count 1 ring shorter', 'A paved road nobody remembers building'],
  hollow: ['Sheltered Hollow', '+', 'A node here has Notice weight 0', 'Out of sight of the town'],
  faerie: ['Faerie-Claimed', '±', 'A node here produces ×1.5; a yearly Tithe: pay 20 × level Silver or Notice +10. Pay 3 times to befriend them', 'The fae remember every gift'],
  friend: ['Faerie Friend', '+', 'A node here produces ×1.5, no Tithe', 'The fae call the covenant friend'],
  glebe: ['Parish Glebe', '-', "A node here counts its ring's Notice factor +1", 'Church land; the priest counts your carts'],
  flood: ['Flood-Prone', '-', 'A node here stops during seconds 100–119 of every year', 'The spring tides reach it'],
  miller: ['The Miller Loves the Baker', '+', 'Throughput +30%. If broken, the surviving end grieves (−30% output for 120 s)', 'Permanent'],
  brother: ['Her Brother Carries It', '+', 'Transit time halved', 'Permanent'],
  worn: ['Well-Worn Track', '+', 'Upgrading this connection to Mule is free', 'Permanent'],
  damp: ['Damp Road', '-', '10% of goods lost in transit', 'Removed by upgrading to Mule'],
  badblood: ['Bad Blood', '-', 'Transit time ×2', "Removed by upgrading to Walking Stones (stones don't hold grudges)"],
  smuggler: ["Smuggler's Path", '±', 'Throughput +20%, but Notice +0.5 per minute', 'Removed by paying 50 Silver to close the side path', .5],
};
const MAGUS_POS = ['affinity', 'gentle', 'diligent'], MAGUS_NEG = ['blatant', 'hunted', 'absent'];
const SANCT = ['aligned', 'greathearth', 'warded', 'drafty', 'haunted', 'cramped'], SANCT_POS = ['aligned', 'greathearth', 'warded'];
const SITE_ROLL = ['fertile', 'roman', 'hollow', 'faerie', 'glebe', 'flood'];
const CONN_POS = ['miller', 'brother', 'worn'], CONN_NEG = ['damp', 'badblood', 'smuggler'];
const RM_COST = { haunted: { silver: 100 }, cramped: { silver: 500, stone: 250 }, smuggler: { silver: 50 } };
const EN = {
  plough: { n: 'Self-Tilling Plough', cost: { insight: 300 }, fx: 'All Farms produce ×2 and need no Bread', sig: '⚘' },
  reed: { n: 'Reed Pen of Diligent Copying', cost: { insight: 800 }, fx: 'All Parchmenters produce ×2', sig: '✎' },
  stones: { n: 'Stones That Carry', cost: { insight: 1500 }, fx: 'Unlocks the Walking Stones connection tier', sig: '⬢' },
  aegis: { n: 'Aegis of the Hearth', cost: { insight: 2000, vis: 20 }, fx: 'Hearth Notice factor 0; Sanctum Insight ×1.25; unlocks the Gate site', sig: '⛨' },
  mist: { n: 'Marsh Mist', cost: { insight: 2500, vis: 10 }, fx: 'All Notice generation ×0.6', sig: '☁' },
};
const RITES = [
  { n: 'The Bells Beneath the Tide', cost: 20000 }, { n: 'The Knight Unburied', cost: 25000 }, { n: 'The Tide Stands Still', cost: 30000 },
];
const NOTICE_K = .35, YEAR = 120, RUN = 4800, DT = .25, SAVE = 'aura-save';

// ─── Helpers ───────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const fmt = n => {
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return Math.floor(n).toLocaleString('en');
};
const fr = n => { const a = Math.abs(n); return a >= 100 ? fmt(n) : a >= 10 ? n.toFixed(1) : n.toFixed(2); };
const fmtCost = c => Object.entries(c).map(([g, v]) => `${fmt(v)} ${G[g].n}`).join(' + ');
const set = (el, h) => { if (el._h !== h) { el.innerHTML = h; el._h = h; } };
const btn = (label, a, x = '', dis = false, cls = '') => `<button class="${cls}" data-a="${a}" data-x="${x}" ${dis ? 'disabled' : ''}>${label}</button>`;
const tdot = k => `<span class="td t${TR[k][1]}" title="${TR[k][0]}"></span>`;
const traitRow = (k, extra = '') => `<div class="trait"><span class="td t${TR[k][1]}"></span><b>${TR[k][0]}</b> ${extra}<div class="small">${TR[k][2]}</div><div class="small dim"><i>${TR[k][3]}</i></div></div>`;

let S = null; // the whole run; plain data so it saves as JSON
let sel = null, connecting = null, drag = null, alerts = [], muted = false, lastReal = 0, acc = 0, stepN = 0;
try { muted = localStorage.getItem('aura-muted') === '1'; } catch (e) {}

const has = k => S.ench.includes(k);
const node = id => S.nodes.find(n => n.id === id);
const site = n => n.site == null ? null : S.sites[n.site];
const ringOf = n => n.site == null ? 0 : S.sites[n.site].ring;
const hall = () => S.nodes[0];
const year = () => Math.floor(1220 + S.t / YEAR);
const can = c => Object.entries(c).every(([g, v]) => S.st[g] >= v - 1e-9);
const spend = c => { for (const g in c) S.st[g] -= c[g]; };
const label = n => n.type === 'sanctum' && n.magus != null ? `${S.magi[n.magus].name}'s Sanctum` : T[n.type].n;
function eta(c) {
  let t = 0;
  for (const g in c) {
    const short = c[g] - S.st[g];
    if (short > 0) t = Math.max(t, (S.rate[g] || 0) > 1e-6 ? short / S.rate[g] : Infinity);
  }
  if (!t) return '';
  if (!isFinite(t)) return ' · <span class="dim">not at current rates</span>';
  return ` · <span class="dim">in ~${t < 90 ? Math.ceil(t) + 's' : Math.ceil(t / 60) + ' min'}</span>`;
}

// ─── Sounds ────────────────────────────────────────────────────────
let actx = null;
function beep(f = 440, d = .12, type = 'sine', vol = .08) {
  if (muted) return;
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
const chime = () => { beep(523); setTimeout(() => beep(659), 80); setTimeout(() => beep(784), 160); };
const bell = () => { beep(330, 1.2, 'triangle', .12); beep(495, 1, 'sine', .05); };

// ─── Setup ─────────────────────────────────────────────────────────
function makeSites() {
  const s = [];
  const add = (ring, kind, name, i, n, off = 0) => s.push({ id: s.length, ring, kind, name, a: i / n * 2 * Math.PI + off - Math.PI / 2, traits: [], node: null, tithes: 0 });
  for (let i = 0; i < 6; i++) add(0, i === 3 ? 'granite' : 'normal', i === 3 ? 'the Granite Face' : 'a Hearth site', i, 6);
  for (let i = 0; i < 8; i++) add(1, 'normal', 'a Bocage field', i, 8, Math.PI / 8);
  const marsh = [['normal'], ['vis', 'the Tide Pool'], ['normal'], ['normal'], ['vis', "the Drowned Knight's Barrow"], ['normal'], ['gate', 'the Gate site'], ['normal'], ['vis', 'the Regio Spring'], ['normal']];
  marsh.forEach(([k, name], i) => add(2, k, name || 'a Marsh flat', i, 10, Math.PI / 10));
  return s;
}
const sitePos = s => [RINGS[s.ring].r * Math.cos(s.a), RINGS[s.ring].r * Math.sin(s.a)];
const pos = n => n.site == null ? [0, 0] : sitePos(S.sites[n.site]);

function newGame() {
  S = {
    t: 0, speed: 1, st: { silver: 200, stone: 50, bread: 40, vellum: 20, vis: 0, insight: 0, grain: 0, salt: 0 },
    nodes: [], conns: [], sites: makeSites(),
    magi: ['Aldric', 'Sabine', 'Hervé'].map(name => ({ name, lt: 10, traits: [], sanctum: null })),
    notice: 0, endow: 0, bribes: 0, armed: { 50: 1, 75: 1, 90: 1 }, ench: [], gate: null, events: [],
    stats: { peak: 0, insight: 0, traits: 0, maxLv: 1, real: 0 }, chron: {}, seen: {}, ftueX: [], rate: {}, nid: 1, cid: 1, over: null,
  };
  S.sites.forEach(s => { if (s.kind !== 'gate' && Math.random() < .25) s.traits.push(pick(SITE_ROLL)); });
  const negs = shuffle(MAGUS_NEG);
  S.magi.forEach((m, i) => { m.traits = [pick(MAGUS_POS), negs[i]]; });
  S.nodes.push(mkNode('hall', null));
  const sanct = addNode('sanctum', 0, true), salt = addNode('saltpan', S.sites.find(s => s.ring === 2 && s.kind === 'normal').id, true);
  addConn(salt.id, 0, 'salt', true); addConn(0, sanct.id, 'vellum', true);
}
const mkNode = (type, siteId) => ({ id: type === 'hall' ? 0 : S.nid++, type, site: siteId, level: 1, inb: {}, pend: {}, outb: 0, traits: [], run: 1, sup: 1, supply: 1, rate: 0, lim: '', grieve: 0, magus: null });

function gainTrait(list, k, init) {
  list.push(k);
  if (!init) { S.stats.traits++; toast(`New trait: ${TR[k][0]}`); beep(880, .15); }
}
function addNode(type, siteId, init) {
  const n = mkNode(type, siteId);
  S.nodes.push(n); S.sites[siteId].node = n.id;
  if (type === 'sanctum') {
    const m = S.magi.find(m => m.sanctum == null);
    m.sanctum = n.id; n.magus = S.magi.indexOf(m);
    gainTrait(n.traits, pick(SANCT), init);
  }
  if (type === 'gate') S.gate = { node: n.id, stone: 0, raised: false, rites: 0, hist: { stone: Array(60).fill(0), vis: Array(60).fill(0) }, cur: { stone: 0, vis: 0 } };
  return n;
}
function addConn(from, to, good, init) {
  const c = { id: S.cid++, from, to, good, tier: 0, traits: [], q: [], flow: 0, jam: 0 };
  S.conns.push(c);
  const r = Math.random();
  if (r < .1) connTrait(c, pick(CONN_POS), init); else if (r < .2) connTrait(c, pick(CONN_NEG), init);
  return c;
}
function connTrait(c, k, init) {
  gainTrait(c.traits, k, init);
  if (k === 'miller' && !S.chron.miller) S.chron.miller = `At the ${label(node(c.to))}, the ${label(node(c.from))}'s workers fell in love.`;
}

// ─── Rules ─────────────────────────────────────────────────────────
const needsBread = n => !['hall', 'gate'].includes(n.type) && !(n.type === 'farm' && has('plough')) && !(n.type === 'sanctum' && n.traits.includes('greathearth'));
const siteHas = (n, k) => !!site(n)?.traits.includes(k);
function inRates(n) {
  const r = { ...(T[n.type].in || {}) };
  if (n.type === 'sanctum' && S.magi[n.magus]?.traits.includes('affinity')) r.vis *= .5;
  return r;
}
function outMult(n) { // every output multiplier lives here
  let m = 1;
  for (const k of site(n)?.traits || []) if (['fertile', 'faerie', 'friend'].includes(k)) m *= 1.5;
  if (n.type === 'farm' && has('plough')) m *= 2;
  if (n.type === 'parchmenter' && has('reed')) m *= 2;
  if (n.type === 'sanctum') {
    if (n.traits.includes('aligned')) m *= 1.25;
    if (n.traits.includes('haunted')) m *= 1.1;
    if (has('aegis')) m *= 1.25;
  }
  if (n.grieve > S.t) m *= .7;
  return m;
}
const outGood = n => Object.keys(T[n.type].out)[0];
const outGoods = n => n.type === 'hall' ? HALL_OUT : ['sanctum', 'gate'].includes(n.type) ? [] : [outGood(n)];
const inCap = (n, g) => g === 'bread' ? 30 * .02 * n.level : 30 * (inRates(n)[g] || 0) * 1.5 ** (n.level - 1);
const weight = n => n.type === 'gate' || siteHas(n, 'hollow') || n.traits.includes('warded') ? 0 : 1 + .5 * (n.level - 1);
const ringFactor = (ring, glebe) => (ring === 0 && has('aegis') ? 0 : RINGS[ring].f) + (glebe ? 1 : 0);
const factor = n => ringFactor(ringOf(n), siteHas(n, 'glebe'));
const lvlCost = n => {
  const L = n.level;
  if (n.type === 'hall') return { silver: 100 * 1.8 ** (L - 1), stone: 100 * 1.8 ** (L - 1) };
  const b = T[n.type].cost.silver;
  return { silver: 2 * b * 1.8 ** (L - 1), stone: b * 1.8 ** (L - 1) };
};
const hasBakeLine = n => S.conns.some(c => c.to === n.id && c.good === 'bread' && node(c.from).type === 'bakehouse');
function whyNoLevel(n) {
  if (n.type === 'gate') return 'The Gate has no levels';
  if (n.traits.includes('cramped') && n.level >= 6) return 'Cramped: can’t level above 6';
  if (n.level === 4 && needsBread(n) && !hasBakeLine(n)) return 'Level 5 needs a Bread supply line from a Bakehouse';
  return '';
}
function flatNotice() {
  let f = 0;
  const add = ks => ks.forEach(k => { f += TR[k][4] || 0; });
  S.magi.forEach(m => add(m.traits)); S.nodes.forEach(n => add(n.traits)); S.conns.forEach(c => add(c.traits));
  return f;
}
const contrib = n => NOTICE_K * weight(n) * factor(n);
function noticeGen() {
  let g = S.nodes.reduce((a, n) => a + contrib(n), 0) + flatNotice() - S.endow;
  if (has('mist')) g *= .6;
  return Math.max(0, g);
}
const eqDelta = (dw, f) => 10 * NOTICE_K * dw * f * (has('mist') ? .6 : 1);
const dist = (a, b) => {
  const d = RD[ringOf(a)][ringOf(b)];
  return siteHas(a, 'roman') ? Math.max(0, d - 1) : d;
};
const connCost = (a, b) => ({ silver: 10 * (1 + dist(a, b)) ** 2 });
const transit = c => 5 * (1 + dist(node(c.from), node(c.to))) * (c.traits.includes('brother') ? .5 : 1) * (c.traits.includes('badblood') ? 2 : 1);
function connCap(c) {
  let m = TIERS[c.tier].cap;
  if (c.traits.includes('miller')) m *= 1.3;
  if (c.traits.includes('smuggler')) m *= 1.2;
  const d = node(c.to);
  if (d.type === 'sanctum') {
    const mt = S.magi[d.magus].traits;
    if (mt.includes('gentle')) m *= 1.5;
    if (mt.includes('blatant')) m *= .5;
  }
  return m;
}
const hallCap = () => 10 * 1.5 ** (hall().level - 1);
function canConnect(src, dst, g) {
  if (src.id === dst.id) return 'A node can’t connect to itself';
  if (dst.type === 'hall') return src.type === 'hall' ? 'Already at the Hall' : '';
  if (dst.type === 'gate') return g === 'stone' || g === 'vis' ? '' : 'The Gate takes only Stone and Vis';
  if (g === 'bread') return src.type === 'bakehouse' ? (needsBread(dst) ? '' : `${label(dst)} needs no Bread`) : 'Supply lines must start at a Bakehouse';
  return (T[dst.type].in || {})[g] ? '' : `${label(dst)} doesn’t use ${G[g].n}`;
}
function buildable(s) {
  if (s.kind === 'granite') return ['quarry'];
  if (s.kind === 'vis') return ['vissource'];
  if (s.kind === 'gate') return has('aegis') && !S.gate ? ['gate'] : [];
  return Object.keys(T).filter(k => T[k].rings?.includes(s.ring) && k !== 'vissource');
}
const studyCost = m => 20 * 1.35 ** (m.lt - 10) * (m.traits.includes('diligent') ? .75 : 1);
function riteStatus() {
  const g = S.gate, avg = k => g.hist[k].reduce((a, b) => a + b, 0) / 60;
  const sanct = S.nodes.filter(n => n.type === 'sanctum');
  const r = { stone: avg('stone'), vis: avg('vis'), sanct: sanct.length === 3 && sanct.every(n => n.supply >= .5), rite: RITES[g.rites] };
  r.ok = g.raised && r.rite && r.stone >= 8 && r.vis >= .5 && r.sanct;
  return r;
}

// ─── Simulation ────────────────────────────────────────────────────
function step(dt) {
  const prev = { ...S.st }, t0 = S.t;
  S.t += dt;
  const yt = S.t % YEAR;
  // arrivals
  for (const c of S.conns) while (c.q.length && c.q[0].at <= S.t) deliver(c, c.q.shift().a);
  // Hall rents and upkeep
  S.st.silver += .2 * dt;
  let need = 0;
  for (const n of S.nodes) if (n.level <= 4 && needsBread(n)) need += .02 * n.level * dt;
  const hallFed = S.st.bread >= need;
  S.st.bread = Math.max(0, S.st.bread - need);
  for (const c of S.conns) {
    if (c.tier === 1) S.st.bread = Math.max(0, S.st.bread - .05 * dt);
    if (c.tier === 2) S.st.vis = Math.max(0, S.st.vis - 2 / 60 * dt);
  }
  // production
  for (const n of S.nodes) if (n.type !== 'hall' && n.type !== 'gate') produce(n, dt, hallFed, yt);
  // transport, rotating the order so splits share fairly
  const hc = hallCap() * dt, budget = { in: hc, out: hc }, L = S.conns.length;
  stepN++;
  for (let i = 0; i < L; i++) send(S.conns[(i + stepN) % L], dt, budget);
  // Notice
  S.notice = Math.max(0, S.notice + (noticeGen() - .1 * S.notice) / 60 * dt);
  S.stats.peak = Math.max(S.stats.peak, S.notice);
  if (S.notice > 1 && !S.seen.notice) S.seen.notice = S.t;
  for (const th of [50, 75, 90]) {
    if (S.armed[th] && S.notice >= th) { S.armed[th] = 0; threshold(th); }
    else if (!S.armed[th] && S.notice < th - 5) S.armed[th] = 1;
  }
  // Gate arrivals, per second
  if (S.gate && Math.floor(S.t) !== Math.floor(t0)) for (const k of ['stone', 'vis']) { S.gate.hist[k].push(S.gate.cur[k]); S.gate.hist[k].shift(); S.gate.cur[k] = 0; }
  // net rates (purchases happen outside step, so they don't count)
  for (const g in S.st) S.rate[g] = (S.rate[g] || 0) + ((S.st[g] - prev[g]) / dt - (S.rate[g] || 0)) * dt / 4;
  if (S.st.vis > 0) S.seen.vis = 1;
  if (S.st.insight > 0) S.seen.insight = 1;
  if (Math.floor(S.t / YEAR) !== Math.floor(t0 / YEAR)) yearTick();
  if (S.notice >= 100) return end('renounced');
  if (S.t >= RUN) return end('fade');
}

function produce(n, dt, hallFed, yt) {
  const d = T[n.type], lm = 1.5 ** (n.level - 1), om = outMult(n), ins = inRates(n), lim = [];
  let eff = 1;
  n.hungry = false;
  if (needsBread(n)) {
    if (n.level >= 5) {
      const need = .02 * n.level * dt, b = n.inb.bread || 0;
      if (b >= need - 1e-9) n.inb.bread = b - need;
      else { n.inb.bread = 0; eff = .5; n.hungry = true; lim.push('Bread supply line'); }
    } else if (!hallFed) { eff = .5; lim.push('the Hall has no Bread'); }
  }
  if (siteHas(n, 'flood') && yt >= 100) { eff = 0; lim.push('flooded by the spring tide'); }
  let sup = 1, sg = null;
  for (const g in ins) {
    const r = Math.min(1, (n.inb[g] || 0) / (ins[g] * lm * dt));
    if (r < sup) { sup = r; sg = g; }
  }
  if (sg && sup < .999) lim.push(`${G[sg].n} input`);
  let run = eff * sup;
  const og = outGood(n);
  if (og === 'insight') {
    const r = .1 * S.magi[n.magus].lt * lm * om * run;
    S.st.insight += r * dt; S.stats.insight += r * dt; n.rate = r;
  } else {
    const full = d.out[og] * lm * om, want = full * run * dt, space = full * 30 - n.outb;
    n.full = want > space - 1e-9 && run > 0;
    if (n.full) { run *= Math.max(0, space) / want; lim.push('output full'); }
    n.outb += full * run * dt; n.rate = full * run;
  }
  for (const g in ins) n.inb[g] = Math.max(0, (n.inb[g] || 0) - ins[g] * lm * dt * run);
  n.run = run; n.sup = sup; n.supply += (sup - n.supply) * Math.min(1, dt / 10); n.lim = lim.join(', ');
  const starve = sup < .5 ? sg : null;
  if (starve && n.starve !== starve && !(n.alertAt > S.t - 60)) { n.alertAt = S.t; notify(`${label(n)} is starved of ${G[starve].n}`, n.id); }
  if (n.full && !n.wasFull && !(n.alertAt > S.t - 60)) { n.alertAt = S.t; notify(`${label(n)} is backed up`, n.id); }
  n.starve = starve; n.wasFull = n.full;
}

function send(c, dt, budget) {
  const src = node(c.from), dst = node(c.to), g = c.good;
  let amt = 0;
  if (c.jam <= S.t) {
    let cap = connCap(c) * dt;
    const avail = src.type === 'hall' ? Math.min(S.st[g], budget.out) : src.outb;
    const space = dst.type === 'hall' ? budget.in : dst.type === 'gate' ? Infinity : inCap(dst, g) - (dst.inb[g] || 0) - (dst.pend[g] || 0);
    amt = Math.max(0, Math.min(cap, avail, space));
  }
  if (amt > 1e-9) {
    if (src.type === 'hall') { S.st[g] -= amt; budget.out -= amt; } else src.outb -= amt;
    if (dst.type === 'hall') budget.in -= amt;
    else dst.pend[g] = (dst.pend[g] || 0) + amt;
    const last = c.q[c.q.length - 1];
    if (last && last.s > S.t - .5) last.a += amt; else c.q.push({ a: amt, s: S.t, at: S.t + transit(c) });
  }
  c.flow += (amt / dt - c.flow) * dt / 3;
}

function deliver(c, a) {
  const dst = node(c.to), g = c.good;
  if (dst.type !== 'hall') dst.pend[g] = Math.max(0, (dst.pend[g] || 0) - a);
  if (c.traits.includes('damp')) a *= .9;
  if (dst.type === 'hall') { if (g === 'salt') S.st.silver += a; else S.st[g] += a; return; }
  if (dst.type === 'gate') {
    S.gate.cur[g] += a;
    if (!S.gate.raised && g === 'stone') {
      S.gate.stone += a;
      if (S.gate.stone >= 1500) { S.gate.raised = true; bell(); toast('The Gate rises from the marsh. Perform the Rites.'); }
    }
    return;
  }
  if (g === 'vellum' && dst.type === 'sanctum') {
    if (S.magi[dst.magus].traits.includes('absent')) a *= .9;
    if (dst.traits.includes('drafty')) a *= .8;
  }
  dst.inb[g] = (dst.inb[g] || 0) + a;
}

function threshold(th) {
  if (th === 50) { S.st.silver *= .9; notify('The tax collector took 10% of your Silver'); }
  if (th === 75) {
    const c = [...S.conns].sort((a, b) => b.flow - a.flow)[0];
    if (c) { c.jam = S.t + 60; notify(`A jam: the ${G[c.good].n} line to the ${label(node(c.to))} stops for 60 s`, c.to, c.id); }
  }
  if (th === 90) S.events.push({ k: 'audit' });
  beep(220, .3, 'square', .05);
}

function yearTick() {
  for (const c of S.conns) if (!c.traits.length && Math.random() < .1) connTrait(c, pick(Math.random() < .5 ? CONN_POS : CONN_NEG));
  for (const s of S.sites) if (s.traits.includes('faerie') && s.node != null) S.events.push({ k: 'tithe', site: s.id });
  if (1260 - year() <= 5) beep(1000, .05, 'square', .06);
  save();
}

function removeConn(c, grieveEnds = [c.from, c.to]) {
  for (const p of c.q) { const d = node(c.to); if (d && d.type !== 'hall') d.pend[c.good] = Math.max(0, (d.pend[c.good] || 0) - p.a); }
  S.conns = S.conns.filter(x => x !== c);
  if (c.traits.includes('miller')) grieveEnds.forEach(id => { const n = node(id); if (n) { n.grieve = S.t + 120; toast(`The ${label(n)} is grieving`); } });
}

// ─── Actions ───────────────────────────────────────────────────────
function tryConnect(dst) {
  const src = node(connecting.from), g = connecting.good, why = canConnect(src, dst, g);
  if (why) return toast(why);
  const cost = connCost(src, dst);
  if (!can(cost)) return toast(`A line costs ${fmtCost(cost)}`);
  spend(cost);
  const c = addConn(src.id, dst.id, g);
  connecting = null; sel = { k: 'conn', id: c.id }; beep(660);
}
function levelUp(n) {
  const c = lvlCost(n);
  if (!can(c) || whyNoLevel(n)) return;
  spend(c); n.level++; chime();
  S.stats.maxLv = Math.max(S.stats.maxLv, n.level);
  if (n.level >= 5 && n.traits.includes('drafty')) { n.traits = n.traits.filter(k => k !== 'drafty'); toast('The walls are finally sealed: Drafty removed'); }
}
function study(m) {
  const c = { insight: studyCost(m) };
  if (S.notice >= 90 || !can(c)) return;
  spend(c); m.lt++; chime();
  const mi = S.magi.indexOf(m), sn = node(m.sanctum);
  if (m.lt === 15 || m.lt === 20) {
    const pool = [...MAGUS_POS.filter(k => !m.traits.includes(k)), ...(sn ? SANCT_POS.filter(k => !sn.traits.includes(k)) : [])];
    if (pool.length) S.events.push({ k: 'break', m: mi, ch: shuffle(pool).slice(0, 2) });
  }
  if (m.lt === 25 && m.traits.some(k => MAGUS_NEG.includes(k))) S.events.push({ k: 'cleanse', m: mi, ch: m.traits.filter(k => MAGUS_NEG.includes(k)) });
}
function performRite() {
  const r = riteStatus();
  if (!r.ok || !can({ insight: r.rite.cost })) return;
  spend({ insight: r.rite.cost }); S.gate.rites++; bell();
  toast(`${r.rite.n}: done.`);
  if (S.gate.rites === 3) end('win');
}

const A = {
  found: () => { newGame(); startGame(); },
  cont: () => { if (load()) startGame(); },
  speed: x => { S.speed = +x; },
  menu: () => showPause(true), resume: () => showPause(false),
  mute: () => { muted = !muted; try { localStorage.setItem('aura-muted', muted ? '1' : '0'); } catch (e) {} showPause(true); },
  restart: () => { if (confirm('Restart the run? Are you sure?')) { showPause(false); newGame(); startGame(); } },
  quit: () => { save(); showPause(false); toTitle(); },
  again: () => toTitle(),
  close: () => { sel = null; connecting = null; },
  sel: x => { const [k, id] = x.split(':'); sel = { k, id: +id }; connecting = null; },
  build: type => {
    const s = S.sites[sel.id], cost = T[type].cost;
    if (s.node != null || !can(cost)) return;
    if (type === 'sanctum' && !S.magi.some(m => m.sanctum == null)) return;
    spend(cost); const n = addNode(type, s.id); sel = { k: 'node', id: n.id }; chime();
  },
  lvl: () => levelUp(node(sel.id)),
  demolish: () => {
    const n = node(sel.id);
    if (!confirm(`Demolish the ${label(n)}? Are you sure?`)) return;
    for (const c of S.conns.filter(c => c.from === n.id || c.to === n.id)) removeConn(c, [c.from, c.to].filter(id => id !== n.id));
    const cost = T[n.type].cost;
    for (const g in cost) S.st[g] += cost[g] / 2;
    if (n.magus != null) S.magi[n.magus].sanctum = null;
    S.sites[n.site].node = null; S.nodes = S.nodes.filter(x => x !== n);
    sel = { k: 'site', id: n.site };
  },
  connect: g => { connecting = { from: sel.id, good: g }; },
  cancel: () => { connecting = null; },
  delconn: () => { const c = S.conns.find(c => c.id === sel.id); if (confirm('Delete this connection? Goods in transit are lost. Are you sure?')) { removeConn(c); sel = null; } },
  upg: () => {
    const c = S.conns.find(c => c.id === sel.id), cost = upgCost(c);
    if (!cost || !can(cost)) return;
    spend(cost); c.tier++; chime();
    if (c.tier === 1) c.traits = c.traits.filter(k => k !== 'damp');
    if (c.tier === 2) c.traits = c.traits.filter(k => k !== 'badblood' && k !== 'damp');
  },
  rm: k => {
    const e = sel.k === 'conn' ? S.conns.find(c => c.id === sel.id) : node(sel.id);
    if (!can(RM_COST[k])) return;
    spend(RM_COST[k]); e.traits = e.traits.filter(x => x !== k); beep(500);
  },
  study: i => study(S.magi[+i]),
  ench: k => {
    if (has(k) || !can(EN[k].cost)) return;
    spend(EN[k].cost); S.ench.push(k); bell();
    alerts.push({ txt: `${EN[k].sig} ${EN[k].n}: ${EN[k].fx}`, until: performance.now() + 20000 });
  },
  endow: () => { const c = { silver: 500 * 2 ** S.endow }; if (can(c)) { spend(c); S.endow++; beep(392, .4); } },
  bribe: () => { const c = { silver: 100 * 2 ** S.bribes }; if (can(c)) { spend(c); S.bribes++; S.notice = Math.max(0, S.notice - 20); beep(392, .4); } },
  rite: () => performRite(),
  unjam: id => { const c = S.conns.find(c => c.id === +id), cost = { silver: S.st.silver * .05 }; if (c) { spend(cost); c.jam = 0; } alerts = alerts.filter(a => a.jam !== +id); },
  alert: i => { const a = alerts[+i]; if (a?.node != null && node(a.node)) sel = { k: 'node', id: a.node }; alerts.splice(+i, 1); },
  ftue: id => S.ftueX.push(id),
  ev: i => resolveEvent(+i),
};
const upgCost = c => {
  const d = dist(node(c.from), node(c.to));
  if (c.tier === 0) return c.traits.includes('worn') ? {} : { silver: 40 * (1 + d) };
  if (c.tier === 1 && has('stones')) return { silver: 50, vis: 5 };
  return null;
};

// ─── Events (the modal) ────────────────────────────────────────────
function eventCard(e) {
  if (e.k === 'audit') return { art: '⚖', title: 'The Quaesitor’s Audit', text: 'A Quaesitor of the Order arrives at Mont-Dol and asks to see your labs. While Notice is 90 or higher, no magus may Study.', opts: ['Open the doors'] };
  if (e.k === 'tithe') {
    const s = S.sites[e.site], n = s.node != null && node(s.node);
    if (!n || !s.traits.includes('faerie')) return null;
    const c = { silver: 20 * n.level };
    return { art: '❦', title: 'The Faerie Tithe', text: `The fae of ${s.name} come for their due at the ${label(n)}. Gifts so far: ${s.tithes}/3.`, opts: [`Pay ${fmtCost(c)}`, 'Refuse them (Notice +10)'], dis: [!can(c), false] };
  }
  const m = S.magi[e.m];
  if (e.k === 'break') return { art: '✧', title: `Breakthrough: ${m.name}`, text: `At Lab Total ${m.lt}, ${m.name} sees something new in the old texts. Choose one:`, opts: e.ch.map(k => `${TR[k][0]}${SANCT.includes(k) ? ' (Sanctum)' : ''}: ${TR[k][2]}`) };
  if (e.k === 'cleanse') {
    return { art: '✧', title: `Breakthrough: ${m.name}`, text: `At Lab Total 25, ${m.name} masters their own nature. Remove one flaw:`, opts: e.ch.map(k => `Remove ${TR[k][0]}`) };
  }
}
function resolveEvent(i) {
  const e = S.events.shift();
  if (e.k === 'tithe') {
    const s = S.sites[e.site], n = node(s.node);
    if (i === 0 && can({ silver: 20 * n.level })) {
      spend({ silver: 20 * n.level });
      if (++s.tithes >= 3) {
        s.traits = s.traits.map(k => k === 'faerie' ? 'friend' : k);
        S.chron.faerie = S.chron.faerie || `The fae of ${s.name} came to call the covenant friend.`;
        S.stats.traits++; toast('Faerie Friend! The Tithe ends.');
      }
    } else S.notice += 10;
  }
  const m = S.magi[e.m];
  if (e.k === 'break') {
    const k = e.ch[i];
    if (SANCT.includes(k)) node(m.sanctum).traits.push(k); else m.traits.push(k);
    S.stats.traits++;
    S.chron.brk = S.chron.brk || `${m.name} found ${TR[k][0]} in ${year()}.`;
  }
  if (e.k === 'cleanse') m.traits = m.traits.filter(k => k !== e.ch[i]);
  chime();
}

// ─── Alerts ────────────────────────────────────────────────────────
function notify(txt, nodeId, jam) {
  alerts.push({ txt, node: nodeId, jam, until: performance.now() + 20000 });
  if (alerts.length > 4) alerts.shift();
}
const toast = txt => notify(txt);

// ─── Screens ───────────────────────────────────────────────────────
function save() { try { if (S && !S.over) localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function load() { try { S = JSON.parse(localStorage.getItem(SAVE)); return !!S; } catch (e) { return false; } }
function hasSave() { try { return !!localStorage.getItem(SAVE); } catch (e) { return false; } }
function toTitle() {
  for (const id of ['end', 'modal', 'pause']) $(id).classList.remove('show');
  $('game').style.display = 'none'; $('title').classList.add('show');

// ─── Rendering: map ────────────────────────────────────────────────
function poly(x, y, r, n, rot = -Math.PI / 2, inner) {
  const p = [];
  for (let i = 0; i < n * (inner ? 2 : 1); i++) {
    const a = rot + i * Math.PI * 2 / (n * (inner ? 2 : 1)), rr = inner && i % 2 ? r * inner : r;
    p.push(`${(x + rr * Math.cos(a)).toFixed(1)},${(y + rr * Math.sin(a)).toFixed(1)}`);
  }
  return `<polygon points="${p.join(' ')}"`;
}
function shape(k, x, y, r) {
  switch (k) {
    case 'circle': return `<circle cx="${x}" cy="${y}" r="${r}"`;
    case 'rect': return `<rect x="${x - r * .85}" y="${y - r * .85}" width="${r * 1.7}" height="${r * 1.7}" rx="3"`;
    case 'wide': return `<rect x="${x - r * 1.1}" y="${y - r * .7}" width="${r * 2.2}" height="${r * 1.4}" rx="2"`;
    case 'tri': return poly(x, y + 3, r * 1.15, 3);
    case 'diamond': return poly(x, y, r * 1.1, 4);
    case 'hex': return poly(x, y, r, 6, 0);
    case 'pent': return poly(x, y, r * 1.05, 5);
    case 'star': return poly(x, y, r * 1.15, 5, -Math.PI / 2, .5);
    case 'arch': return `<path d="M${x - r} ${y + r} V${y - r * .2} A${r} ${r} 0 0 1 ${x + r} ${y - r * .2} V${y + r} H${x + r * .5} V${y} A${r * .5} ${r * .5} 0 0 0 ${x - r * .5} ${y} V${y + r} Z"`;
  }
}
const tdotSvg = (x, y, k) => `<circle cx="${x}" cy="${y}" r="4" fill="${{ '+': '#e0b450', '-': '#8e2a1f', '±': 'url(#mix)' }[TR[k][1]]}" stroke="#000" stroke-width=".8"/>`;

function renderMap(now) {
  const pulse = .5 + .5 * Math.sin(now / 180);
  let h = `<circle r="375" fill="#0f2229"/><circle r="270" fill="#1a2a19"/><circle r="170" fill="#27261e"/><circle r="70" fill="#2e2c22"/>
    <text x="0" y="-356" text-anchor="middle" fill="#4f7c86" font-size="13">MARSH · Notice ×${ringFactor(2)}</text>
    <text x="0" y="-252" text-anchor="middle" fill="#6d8a55" font-size="13">✝ BOCAGE · Notice ×${ringFactor(1)}</text>
    <text x="0" y="-152" text-anchor="middle" fill="#8a7f5e" font-size="13">HEARTH · Notice ×${ringFactor(0)}</text>`;
  // connections, parallel ones fanned out
  const groups = {};
  for (const c of S.conns) { const k = [c.from, c.to].sort().join('-'); (groups[k] = groups[k] || []).push(c); }
  for (const list of Object.values(groups)) list.forEach((c, i) => {
    const [x1, y1] = pos(node(c.from)), [x2, y2] = pos(node(c.to));
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const off = (i - (list.length - 1) / 2) * 9 * (c.from < c.to ? 1 : -1);
    const ax = x1 - uy * off, ay = y1 + ux * off, bx = x2 - uy * off, by = y2 + ux * off;
    const share = Math.min(1, c.flow / connCap(c)), col = G[c.good].c, jam = c.jam > S.t;
    const dash = c.tier === 0 ? 'stroke-dasharray="7 5"' : c.tier === 2 ? 'stroke-dasharray="4 7" stroke-linecap="round"' : '';
    const sel_ = sel?.k === 'conn' && sel.id === c.id;
    h += `<g data-m="conn:${c.id}">`;
    if (c.tier === 2) h += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${col}" stroke-opacity=".25" stroke-width="12"/>`;
    if (share > .95) h += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${col}" stroke-opacity=".3" stroke-width="10"/>`;
    h += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${jam ? '#c8412f' : col}" stroke-opacity="${sel_ ? 1 : .75}" stroke-width="${(1.5 + 5 * share).toFixed(1)}" ${dash}/>
      <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="transparent" stroke-width="16"/>`;
    const deg = Math.atan2(uy, ux) * 180 / Math.PI, mx = ax + (bx - ax) * .6, my = ay + (by - ay) * .6;
    h += `<polygon points="-5,-4 5,0 -5,4" fill="${col}" transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${deg.toFixed(0)})"/>`;
    if (share > .95) h += `<text x="${mx}" y="${my - 8}" fill="${col}" font-size="12" text-anchor="middle">»</text>`;
    if (jam) h += `<text x="${mx}" y="${my - 8}" fill="#c8412f" font-size="12" text-anchor="middle">jammed</text>`;
    c.traits.forEach((k, j) => { h += tdotSvg((ax + bx) / 2 + j * 9, (ay + by) / 2 - 8, k); });
    h += '</g>';
    for (const p of c.q) {
      const f = Math.min(1, Math.max(0, (S.t - p.s) / (p.at - p.s)));
      h += `<circle cx="${(ax + (bx - ax) * f).toFixed(1)}" cy="${(ay + (by - ay) * f).toFixed(1)}" r="2.6" fill="${col}"/>`;
    }
  });
  if (drag?.moved && drag.p) { const [x, y] = pos(node(drag.from)); h += `<line x1="${x}" y1="${y}" x2="${drag.p[0]}" y2="${drag.p[1]}" stroke="#fff" stroke-dasharray="4 4"/>`; }
  // sites
  const tidePrompt = !S.nodes.some(n => n.type === 'vissource');
  for (const s of S.sites) {
    const [x, y] = sitePos(s);
    if (s.node != null) continue;
    if (s.kind === 'gate' && !has('aegis')) continue;
    const col = s.kind === 'vis' ? '#b27cff' : s.kind === 'gate' ? '#4fb3a5' : s.kind === 'granite' ? '#9a9ca3' : '#7d8577';
    const isSel = sel?.k === 'site' && sel.id === s.id;
    h += `<g data-m="site:${s.id}">`;
    if (tidePrompt && s.name === 'the Tide Pool') h += `<circle cx="${x}" cy="${y}" r="${24 + 4 * pulse}" fill="none" stroke="#b27cff" stroke-opacity="${pulse}" stroke-width="2"/>`;
    h += `<circle cx="${x}" cy="${y}" r="16" fill="#0004" stroke="${isSel ? '#fff' : col}" stroke-dasharray="4 3" stroke-width="${isSel ? 2 : 1.2}"/>`;
    if (s.kind !== 'normal') h += `<text x="${x}" y="${y + 5}" text-anchor="middle" fill="${col}" font-size="14">${{ vis: '✦', gate: '∩', granite: '▲' }[s.kind]}</text>`;
    s.traits.forEach((k, j) => { h += tdotSvg(x + 12 + j * 9, y - 12, k); });
    if (s.kind !== 'normal') h += `<text x="${x}" y="${y + 30}" text-anchor="middle" fill="${col}" font-size="10">${s.name.replace('the ', '')}</text>`;
    h += '</g>';
  }
  // nodes
  for (const n of S.nodes) {
    const [x, y] = pos(n), d = T[n.type], r = n.type === 'hall' ? 34 : 19;
    const isSel = sel?.k === 'node' && sel.id === n.id;
    const valid = connecting && !canConnect(node(connecting.from), n, connecting.good);
    h += `<g data-m="node:${n.id}">`;
    if (valid) h += `<circle cx="${x}" cy="${y}" r="${r + 8}" fill="none" stroke="#7bc96f" stroke-width="2" stroke-dasharray="3 3"/>`;
    if (n.starve) h += `<circle cx="${x}" cy="${y}" r="${r + 5}" fill="none" stroke="#ffb020" stroke-width="3" stroke-opacity="${pulse}"/>`;
    let fill = d.col, op = 1;
    if (n.type === 'gate') op = .35 + .65 * Math.min(1, S.gate.stone / 1500);
    if (n.type === 'sanctum' && n.sup > .99 && n.run > 0) h += `<circle cx="${x}" cy="${y}" r="${r + 4}" fill="#6fd3ff" fill-opacity=".15"/>`;
    h += `${shape(d.shape, x, y, r)} fill="${fill}" fill-opacity="${op}" stroke="${isSel ? '#fff' : '#000'}" stroke-width="${isSel ? 2.5 : 1}"/>`;
    h += `<text x="${x}" y="${y + (n.type === 'hall' ? 9 : 5)}" text-anchor="middle" font-size="${n.type === 'hall' ? 26 : 14}" fill="#1a1a14">${d.sym}</text>`;
    if (n.type !== 'gate') h += `<circle cx="${x + r * .8}" cy="${y + r * .8}" r="8" fill="#111" stroke="${d.col}"/><text x="${x + r * .8}" y="${y + r * .8 + 4}" text-anchor="middle" font-size="10" fill="#fff">${n.level}</text>`;
    if (n.full) h += `${poly(x + r * .8, y - r * .8, 7, 8, Math.PI / 8)} fill="#c8412f"/><rect x="${x + r * .8 - 3}" y="${y - r * .8 - 1}" width="6" height="2" fill="#fff"/>`;
    if (n.hungry) h += `<text x="${x - r}" y="${y - r * .6}" font-size="14" fill="#d99a4e">◡</text>`;
    if (n.starve) h += `<text x="${x - r - 4}" y="${y + 4}" font-size="13" fill="#ffb020" text-anchor="end">${G[n.starve].s}</text>`;
    (n.type === 'sanctum' ? n.traits : []).concat(site(n)?.traits || []).forEach((k, j) => { h += tdotSvg(x - r * .8 + j * 9, y - r - 5, k); });
    if (n.type !== 'hall' && n.type !== 'gate') {
      const og = outGood(n);
      h += `<text x="${x}" y="${y + r + 17}" text-anchor="middle" font-size="10" fill="${G[og].c}">+${fr(n.rate)} ${G[og].n}/s</text>`;
    }
    if (n.type === 'gate') h += `<text x="${x}" y="${y + r + 17}" text-anchor="middle" font-size="10" fill="#4fb3a5">${S.gate.raised ? `Rites ${S.gate.rites}/3` : `${fmt(S.gate.stone)}/1,500 Stone`}</text>`;
    h += '</g>';
  }
  set($('world'), h);
}

  if (!n) { sel = null; return ''; }
  const conns = S.conns.filter(c => c.from === n.id || c.to === n.id);
  const connList = `<h3>Connections</h3>${conns.map(c => btn(`${c.from === n.id ? '→' : '←'} ${G[c.good].s} ${G[c.good].n} ${c.from === n.id ? 'to' : 'from'} ${label(node(c.from === n.id ? c.to : c.from))} · ${TIERS[c.tier].n} · ${fr(c.flow)}/s`, 'sel', `conn:${c.id}`, false, 'wide small')).join('') || '<div class="dim small">None</div>'}`;
  const connBtns = outGoods(n).map(g => btn(`Connect ${G[g].s} ${G[g].n} →`, 'connect', g)).join(' ');
  const lc = lvlCost(n), why = whyNoLevel(n);
  const lvlBtn = n.type === 'gate' ? '' : `<h3>Level ${n.level}</h3>${why ? `<div class="small red">${why}</div>` : ''}
    ${btn(`Level up: ${fmtCost(lc)} <span class="small dim">· +${eqDelta(weight(n) ? .5 : 0, factor(n)).toFixed(1)} Notice at rest</span>`, 'lvl', '', !can(lc) || !!why, 'wide')}${eta(lc)}`;
  if (n.type === 'hall') {
    return `${x}<h2>⌂ Covenant Hall</h2><div class="dim">Stores every good · rents 0.2 Silver/s · 1 Silver per Salt received</div>
      <h3>Stores</h3>${Object.keys(G).filter(g => g !== 'insight').map(g => `<div class="row"><span><span style="color:${G[g].c}">${G[g].s}</span> ${G[g].n}</span><span>${fmt(S.st[g])}</span></div>`).join('')}
      <div class="small dim">Throughput cap: ${fr(hallCap())} goods/s in and out</div>${lvlBtn}
      <h3>Send from the Hall</h3>${connBtns}${connList}`;
  }
  const lm = 1.5 ** (n.level - 1), ins = inRates(n), s = site(n);
  let io = '';
  for (const g in ins) io += `<div class="row"><span>needs ${G[g].s} ${G[g].n}</span><span>${fr(ins[g] * lm)}/s · buffer ${fr(n.inb[g] || 0)}</span></div>`;
  if (needsBread(n)) io += `<div class="row"><span>eats ${G.bread.s} Bread</span><span>${fr(.02 * n.level)}/s ${n.level >= 5 ? `from supply line · buffer ${fr(n.inb.bread || 0)}` : 'from the Hall'}</span></div>`;
  if (n.type !== 'gate') io += `<div class="row"><span>makes ${G[outGood(n)].s} ${G[outGood(n)].n}</span><span>${fr(n.rate)}/s${outGood(n) !== 'insight' ? ` · stored ${fr(n.outb)}` : ''}</span></div>`;
  let gate = '';
  if (n.type === 'gate') {
    const r = riteStatus(), mark = ok => ok ? '<span class="ok">✔</span>' : '<span class="red">✘</span>';
    gate = S.gate.raised
      ? `<h3>The Rites (${S.gate.rites}/3)</h3>${r.rite ? `<b>${r.rite.n}</b>
        <div>${mark(r.stone >= 8)} Stone arriving ${fr(r.stone)}/s (need 8)</div><div>${mark(r.vis >= .5)} Vis arriving ${fr(r.vis)}/s (need 0.5)</div>
        <div>${mark(r.sanct)} All 3 Sanctums at 50%+ supply</div><div>${mark(can({ insight: r.rite.cost }))} ${fmt(r.rite.cost)} Insight</div>
        ${btn('Perform Rite', 'rite', '', !r.ok || !can({ insight: r.rite.cost }))}` : ''}`
      : `<h3>Raise the Gate</h3><div>${fmt(S.gate.stone)} / 1,500 Stone delivered</div><div class="bar"><div style="width:${S.gate.stone / 15}%"></div></div>`;
  }
  const traits = n.traits.map(k => traitRow(k, RM_COST[k] ? btn(`Remove: ${fmtCost(RM_COST[k])}`, 'rm', k, !can(RM_COST[k])) : '')).join('') + (s?.traits || []).map(k => traitRow(k, '<span class="small dim">(site)</span>')).join('');
  return `${x}<h2><span style="color:${T[n.type].col}">${T[n.type].sym}</span> ${label(n)}</h2>
    <div class="dim">${RINGS[ringOf(n)].n} ring${s ? ` · ${s.name}` : ''} · Notice weight ${weight(n)}</div>
    ${n.lim ? `<div class="amber small">Limited by: ${n.lim}</div>` : ''}${n.grieve > S.t ? '<div class="red small">Grieving: −30% output</div>' : ''}
    <h3>Production</h3>${io}${traits ? `<h3>Traits</h3>${traits}` : ''}${gate}${lvlBtn}
    ${connBtns ? `<h3>Connect</h3>${connBtns}` : ''}${connList}
    ${n.magus != null ? `<p>${btn(`${S.magi[n.magus].name} (magus)`, 'sel', `magus:${n.magus}`)}</p>` : ''}
    ${n.type !== 'gate' ? `<p>${btn(`Demolish (refund ${fmtCost(Object.fromEntries(Object.entries(T[n.type].cost).map(([g, v]) => [g, v / 2])))})`, 'demolish')}</p>` : ''}`;
}

function renderPanel() {
  $('panel').classList.toggle('show', !!sel);
  if (sel) set($('panel'), panelHTML());
}

function renderModal() {
  const m = $('modal');
  while (S.events.length) {
    const c = eventCard(S.events[0]);
    if (c) {
      set(m, `<div class="card"><div class="art">${c.art}</div><h2>${c.title}</h2><p>${c.text}</p>${c.opts.map((o, i) => btn(o, 'ev', i, c.dis?.[i], 'wide')).join('')}</div>`);
      m.classList.add('show');
      return true;
    }
    S.events.shift();
  }
  m.classList.remove('show');
  return false;
}

// ─── Loop and input ────────────────────────────────────────────────
let lastDraw = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(.25, (now - (lastReal || now)) / 1000);
  lastReal = now;
  if (!S || S.over) return;
  const blocked = renderModal() || $('pause').classList.contains('show');
  if (!blocked) {
    S.stats.real += real;
    acc += real * S.speed;
    let n = 0;
    while (acc >= DT && n++ < 20 && !S.over && !S.events.length) { step(DT); acc -= DT; }
    if (S.speed === 0) acc = 0;
  }
  if (S.over || now - lastDraw < 33) return;
  lastDraw = now;
  renderMap(now); renderHUD(); renderPanel();
}
requestAnimationFrame(frame);

// Buttons act on pointerdown: panels re-render often, which would swallow a click
function act(e) {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  e.preventDefault();
  A[t.dataset.a]?.(t.dataset.x);
}
document.addEventListener('pointerdown', e => { if (e.button === 0) act(e); });
document.addEventListener('click', e => { if (e.detail === 0) act(e); }); // keyboard activation

const map = $('map');
const svgPt = e => { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(map.getScreenCTM().inverse()); return [p.x, p.y]; };
map.addEventListener('pointerdown', e => {
  if (!S) return;
  const t = e.target.closest('[data-m]');
  if (!t) { if (connecting) connecting = null; else sel = null; return; }
  const [k, id] = t.dataset.m.split(':');
  if (k === 'node') {
    const n = node(+id);
    if (connecting) return tryConnect(n);
    sel = { k: 'node', id: n.id };
    drag = { from: n.id, x: e.clientX, y: e.clientY, moved: false };
    map.setPointerCapture(e.pointerId);
  } else { connecting = null; sel = { k, id: +id }; }
});
map.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.p = svgPt(e);
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
});
map.addEventListener('pointerup', e => {
  const d = drag; drag = null;
  if (!d?.moved) return;
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-m^="node:"]');
  if (!el) return;
  const src = node(d.from), dst = node(+el.dataset.m.split(':')[1]), goods = outGoods(src);
  if (dst === src) return;
  if (goods.length !== 1) return toast(src.type === 'hall' ? 'From the Hall, pick a good in its panel, then tap the destination.' : `${label(src)} has nothing to send`);
  connecting = { from: src.id, good: goods[0] };
  tryConnect(dst);
  connecting = null;
});
document.addEventListener('keydown', e => {
  if (!S || S.over) return;
  if (e.key === 'Escape') { if (connecting) connecting = null; else if (sel) sel = null; else showPause(!$('pause').classList.contains('show')); }
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); S.speed = S.speed ? 0 : 1; }
});
addEventListener('beforeunload', save);
toTitle();
    </script>
  </body>
